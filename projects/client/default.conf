server {
    listen 80;
    listen [::]:80;

    location /api/ {
        proxy_pass http://songpb_api:8080/;
    }

    location /ping {
        access_log off;
        return 200;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }
}