version: '3.9'
services:
  mongo:
    container_name: songpb_mongo
    image: mongo:latest
    restart: always
    ports:
      - '${DB_PORT}:27017'
    environment:
      - MONGO_INITDB_DATABASE=songs
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./assets/database:/data/db
      - ./assets/initdb:/docker-entrypoint-initdb.d/
    command: [--auth]
    networks:
      - songpb_network
  api:
    build:
      context: projects/api
      target: dev
    restart: always
    container_name: songpb_api
    ports:
      - '8080:8080'
      - '9229:9229'
    volumes:
      - ./projects/api/src/:/opt/app/src
    environment:
      - NODE_ENV:development
    networks:
      - songpb_network
    depends_on:
      - mongo
  client:
    build:
      context: projects/client
      target: dev
    restart: always
    container_name: songpb_client
    ports:
      - '${CLIENT_PORT}:3000'
    volumes:
      - ./projects/client/src/:/opt/app/src
      - ./projects/client/public/:/opt/app/public
    environment:
      WATCHPACK_POLLING: true
      HOST: songpb_api
    networks:
      - songpb_network
    depends_on:
      - api

networks:
  songpb_network:
    driver: bridge
