version: "3.9"
services:
  mongo:
    container_name: songpb_mongo
    image: mongo:latest
    restart: always
    ports:
      - "4001:27017"
    environment:
      - MONGO_INITDB_DATABASE=songs
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./assets/database:/data/db
      - ./assets/initdb:/docker-entrypoint-initdb.d/
    command: [--auth]
    networks:
      - songpb_network
  api:
    build:
      context: projects/api
      target: prod
    restart: always
    container_name: songpb_api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV:production
    networks:
      - songpb_network
    depends_on:
      - mongo

networks:
  songpb_network:
    driver: bridge
