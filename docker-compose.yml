version: "3.9"
services:
  mongo:
    container_name: songpb_mongo
    image: mongo:latest
    restart: always
    ports:
      - "${DB_PORT}:27017"
    environment:
      - MONGO_INITDB_DATABASE=songs
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./assets/database:/data/db
      - ./assets/initdb:/docker-entrypoint-initdb.d/
    command: [ --auth ]
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    networks:
      - songpb_network
  api:
    build:
      context: projects/api
      target: prod
    restart: always
    container_name: songpb_api
    environment:
      - NODE_ENV:production
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    networks:
      - songpb_network
    depends_on:
      - mongo
  client:
    build:
      context: projects/client
      target: prod
    restart: always
    container_name: songpb_client
    ports:
      - "${CLIENT_PORT}:80"
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    networks:
      - songpb_network
    depends_on:
      - api

networks:
  songpb_network:
    driver: bridge
